{% extends "base.html" %}
{% block title %}Hapus Tugas{% endblock %}

{% block content %}
<div class="alert alert-warning">
    <h4>Yakin mau menghapus tugas ini?</h4>
    <p><strong>{{ task.title }}</strong></p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Ya, Hapus</button>
        <a href="{% url 'tasks:task-detail' task.pk %}" class="btn btn-outline-secondary">Batal</a>
    </form>
</div>
{% endblock %}
